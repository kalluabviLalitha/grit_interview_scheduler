
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GRIT | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        .login-card {
            background: white;
            width: min(420px, 92%);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px #17255415;
        }

        h1 {
            color: #172554;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7ddea;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #3157d5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            color: #b42332;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1>GRIT</h1>

    <p class="subtitle">
        Interview Scheduling Portal
    </p>

    <form id="loginForm">

        <label for="email">
            Email address
        </label>

        <input
            type="email"
            id="email"
            required
            placeholder="Enter your email"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            required
            placeholder="Enter your password"
        >

        <button type="submit" id="loginButton">
            Login
        </button>

        <div id="message" role="alert"></div>

    </form>

</div>

<script src="api.js"></script>

<script>

    // ---------- Check existing login ----------

    async function checkExistingLogin() {

        if (!getToken()) {
            return;
        }

        try {

            // Verify the token with the backend.
            const user = await getProfile();

            sessionStorage.setItem(
                "grit_user",
                JSON.stringify(user)
            );

            // Redirect according to role.
            window.location.replace(
                getRoleDashboard(user)
            );

        } catch (error) {

            clearAuthSession();

        }
    }

    // ---------- Login form ----------

    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const button =
                document.getElementById("loginButton");

            const message =
                document.getElementById("message");

            button.disabled = true;
            button.textContent = "Logging in...";

            message.textContent = "";

            try {

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                // Authenticate user.
                const user = await login(email, password);

                // Find correct dashboard.
                const destination =
                    getRoleDashboard(user);

                if (destination === "login.html") {
                    throw new Error("Invalid user role.");
                }

                // Navigate to correct page.
                window.location.replace(destination);

            } catch (error) {

                message.textContent = error.message;

            } finally {

                button.disabled = false;
                button.textContent = "Login";

            }

        });

    // Run existing session check.
    checkExistingLogin();

</script>

</body>
</html>
