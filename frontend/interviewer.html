
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIT Interviewer Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f9;
      color: #202638;
    }
    header {
      background: #101936;
      color: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main { max-width: 1100px; margin: 30px auto; padding: 0 18px; }
    section {
      background: white;
      padding: 25px;
      margin-bottom: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000c;
    }
    h1, h2 { margin-top: 0; }
    input, button {
      padding: 11px;
      margin: 6px 4px 6px 0;
      border-radius: 6px;
      border: 1px solid #ccd2df;
    }
    button {
      background: #315bd6;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:hover { background: #2447b2; }
    .danger { background: #bd3545; }
    .message { margin-top: 12px; color: #315bd6; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e8ef;
    }
    th { background: #f5f6fa; }
  </style>
</head>
<body>

<header>
  <strong>GRIT INTERVIEW PORTAL</strong>
  <button class="danger" onclick="logout()">Logout</button>
</header>

<main>
  <section>
    <h1 id="welcome">Welcome, Interviewer</h1>
    <p id="profile">Loading profile...</p>
  </section>

  <section>
    <h2>Manage My Availability</h2>
    <p>Add a date and time when students can book an interview.</p>

    <label for="slotDate">Interview date</label><br>
    <input type="date" id="slotDate" required><br>

    <label for="slotTime">Start time</label><br>
    <input type="time" id="slotTime" required><br>

    <label for="duration">Duration (minutes)</label><br>
    <input type="number" id="duration" value="30" min="15" max="180"><br>

    <button onclick="createSlot()">Add Available Slot</button>
    <p id="slotMessage" class="message"></p>
  </section>

  <section>
    <h2>My Assigned Interviews</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Student</th>
            <th>Interview Date</th>
            <th>Status</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="bookingRows">
          <tr><td colspan="5">Loading interviews...</td></tr>
        </tbody>
      </table>
    </div>
    <p id="bookingMessage" class="message"></p>
  </section>
</main>

<!-- Connect to the shared API helper -->
<script src="api.js"></script>

<script>
async function loadProfile() {
  try {
    const user = await getProfile();

    if (user.role !== "interviewer") {
      alert("Please log in with an interviewer account.");
      logout();
      return;
    }

    document.getElementById("welcome").textContent =
      "Welcome, " + user.name;

    document.getElementById("profile").textContent =
      user.email + " | INTERVIEWER";

  } catch (error) {
    document.getElementById("profile").textContent =
      error.message;
  }
}

async function loadBookings() {
  const tbody = document.getElementById("bookingRows");
  const message = document.getElementById("bookingMessage");

  try {
    const bookings = await apiRequest("/me/bookings");
    tbody.replaceChildren();
    message.textContent = "";

    if (!Array.isArray(bookings) || bookings.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="5">No assigned interviews yet.</td></tr>';
      return;
    }

    bookings.forEach(item => {
      const tr = document.createElement("tr");

      [
        item.booking_id,
        item.student_name,
        item.start_at,
        item.status,
        item.result || "Pending"
      ].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value ?? "-";
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

  } catch (error) {
    tbody.innerHTML =
      '<tr><td colspan="5">Could not load interviews.</td></tr>';

    message.textContent = error.message;
  }
}

async function createSlot() {
  const date = document.getElementById("slotDate").value;
  const time = document.getElementById("slotTime").value;
  const duration = Number(document.getElementById("duration").value);
  const message = document.getElementById("slotMessage");

  if (!date || !time || !duration) {
    message.textContent =
      "Please enter date, time and duration.";
    return;
  }

  const startAt = date + "T" + time + ":00";

  try {
    const user = await getProfile();

    await apiRequest("/slots", {
      method: "POST",
      body: JSON.stringify({
        interviewer_id: user.id,
        start_at: startAt,
        duration: duration
      })
    });

    message.textContent = "Availability added successfully!";

    document.getElementById("slotDate").value = "";
    document.getElementById("slotTime").value = "";

  } catch (error) {
    message.textContent =
      "Could not add slot: " + error.message;
  }
}

// Load interviewer information and assigned bookings
loadProfile();
loadBookings();
</script>

</body>
</html>
